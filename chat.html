<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat — Atendimento</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: "class"
    }
  </script>
</head>

<body class="bg-zinc-100 dark:bg-zinc-950 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md h-[700px] bg-white dark:bg-zinc-900 rounded-2xl shadow-xl overflow-hidden flex flex-col">

    <!-- HEADER -->
    <header class="px-5 py-4 bg-black text-white flex items-center justify-between">

      <div>
        <h1 class="font-semibold text-lg">
          Atendimento
        </h1>

        <p class="text-xs text-zinc-400">
          Estamos online
        </p>
      </div>

      <div class="w-3 h-3 bg-green-500 rounded-full"></div>

    </header>


    <!-- IDENTIFICAÇÃO -->
    <div id="clienteBox" class="p-4 border-b dark:border-zinc-800">

      <input
        id="nome"
        type="text"
        placeholder="Seu nome"
        class="w-full px-4 py-3 rounded-xl bg-zinc-100 dark:bg-zinc-800 dark:text-white outline-none mb-2"
      >

      <input
        id="email"
        type="email"
        placeholder="Seu e-mail"
        class="w-full px-4 py-3 rounded-xl bg-zinc-100 dark:bg-zinc-800 dark:text-white outline-none"
      >

    </div>


    <!-- MENSAGENS -->
    <main
      id="mensagens"
      class="flex-1 overflow-y-auto p-4 space-y-3"
    >

      <div class="text-center text-sm text-zinc-400">
        Inicie uma conversa.
      </div>

    </main>


    <!-- INPUT -->
    <form
      id="chatForm"
      class="p-3 border-t dark:border-zinc-800 flex gap-2"
    >

      <input
        id="mensagem"
        type="text"
        placeholder="Digite sua mensagem..."
        autocomplete="off"
        class="flex-1 px-4 py-3 rounded-xl bg-zinc-100 dark:bg-zinc-800 dark:text-white outline-none"
      >

      <button
        type="submit"
        class="px-5 rounded-xl bg-black text-white hover:bg-zinc-800 transition"
      >
        Enviar
      </button>

    </form>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // =========================
    // FIREBASE
    // =========================

    const firebaseConfig = {

     apiKey: "AIzaSyD-xzRjMRVUpey19g745DvPjjpCApqSHVE",
  authDomain: "myops-d7525.firebaseapp.com",
  projectId: "myops-d7525",
  storageBucket: "myops-d7525.firebasestorage.app",
  messagingSenderId: "247824192162",
  appId: "1:247824192162:web:77c91ab1e3df855dc7fdfb"

    };


    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    // =========================
    // ELEMENTOS
    // =========================

    const nomeInput = document.getElementById("nome");
    const emailInput = document.getElementById("email");
    const mensagemInput = document.getElementById("mensagem");
    const mensagens = document.getElementById("mensagens");
    const chatForm = document.getElementById("chatForm");


    // =========================
    // ID DO CLIENTE
    // =========================

    let clienteId = localStorage.getItem("chatClienteId");

    if (!clienteId) {

      clienteId =
        "cliente_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2, 8);

      localStorage.setItem(
        "chatClienteId",
        clienteId
      );

    }


    // =========================
    // ENVIAR MENSAGEM
    // =========================

    chatForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const nome = nomeInput.value.trim();
      const email = emailInput.value.trim();
      const texto = mensagemInput.value.trim();


      if (!nome) {
        alert("Digite seu nome.");
        nomeInput.focus();
        return;
      }


      if (!email) {
        alert("Digite seu e-mail.");
        emailInput.focus();
        return;
      }


      if (!texto) {
        return;
      }


      try {

        await addDoc(
          collection(db, "chats"),
          {

            clienteId: clienteId,

            nome: nome,

            email: email,

            mensagem: texto,

            remetente: "cliente",

            criadoEm: serverTimestamp()

          }
        );


        mensagemInput.value = "";

        mensagemInput.focus();


      } catch (error) {

        console.error(error);

        alert(
          "Erro ao enviar mensagem."
        );

      }

    });


    // =========================
    // RECEBER MENSAGENS
    // =========================

    const mensagensQuery = query(

      collection(db, "chats"),

      orderBy(
        "criadoEm",
        "asc"
      )

    );


    onSnapshot(
      mensagensQuery,
      (snapshot) => {

        mensagens.innerHTML = "";


        if (snapshot.empty) {

          mensagens.innerHTML = `
            <div class="text-center text-sm text-zinc-400">
              Inicie uma conversa.
            </div>
          `;

          return;

        }


        snapshot.forEach((doc) => {

          const data = doc.data();


          const minhaMensagem =
            data.clienteId === clienteId &&
            data.remetente === "cliente";


          const div = document.createElement("div");


          div.className =
            minhaMensagem
              ? "flex justify-end"
              : "flex justify-start";


          div.innerHTML = `

            <div
              class="
                max-w-[80%]
                px-4
                py-3
                rounded-2xl
                text-sm

                ${
                  minhaMensagem
                    ? "bg-black text-white rounded-br-sm"
                    : "bg-zinc-200 text-zinc-900 dark:bg-zinc-800 dark:text-white rounded-bl-sm"
                }
              "
            >

              ${
                !minhaMensagem
                  ? `<div class="text-xs font-semibold mb-1 opacity-60">
                      ${data.nome || "Atendimento"}
                    </div>`
                  : ""
              }

              <div>
                ${escapeHTML(data.mensagem || "")}
              </div>

            </div>

          `;


          mensagens.appendChild(div);

        });


        mensagens.scrollTop =
          mensagens.scrollHeight;

      }
    );


    // =========================
    // SEGURANÇA BÁSICA
    // =========================

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

  </script>

</body>
</html>
