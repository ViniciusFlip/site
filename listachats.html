
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conversas</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-900">

  <div class="max-w-md mx-auto min-h-screen bg-white">

    <!-- CABEÇALHO -->
    <header class="p-4 border-b">
      <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold">Conversas</h1>

        <a
          href="novaconversa.html"
          class="px-3 py-2 bg-black text-white rounded-lg text-sm"
        >
          Nova conversa
        </a>
      </div>
    </header>

    <!-- LISTA -->
    <main id="lista" class="divide-y">
      <div class="p-6 text-center text-gray-500">
        Carregando conversas...
      </div>
    </main>

  </div>

  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      orderBy,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


    // =====================================================
    // SUAS CREDENCIAIS FIREBASE
    // =====================================================

    const firebaseConfig = {

     apiKey: "AIzaSyD-xzRjMRVUpey19g745DvPjjpCApqSHVE",
    authDomain: "myops-d7525.firebaseapp.com",
    projectId: "myops-d7525",
    storageBucket: "myops-d7525.firebasestorage.app",
    messagingSenderId: "247824192162",
    appId: "1:247824192162:web:77c91ab1e3df855dc7fdfb"

    };


    // =====================================================
    // FIREBASE
    // =====================================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const lista = document.getElementById("lista");


    // =====================================================
    // USUÁRIO LOGADO
    // =====================================================

    onAuthStateChanged(auth, (user) => {

      if (!user) {

        lista.innerHTML = `
          <div class="p-6 text-center text-gray-500">
            Você precisa estar logado.
          </div>
        `;

        return;
      }


      // ===================================================
      // BUSCAR CONVERSAS
      // ===================================================

      const q = query(
        collection(db, "conversations"),
        where("participants", "array-contains", user.uid),
        orderBy("updatedAt", "desc")
      );


      onSnapshot(q, (snapshot) => {

        lista.innerHTML = "";


        if (snapshot.empty) {

          lista.innerHTML = `
            <div class="p-8 text-center text-gray-500">
              Nenhuma conversa ainda.
            </div>
          `;

          return;
        }


        snapshot.forEach((doc) => {

          const conversa = doc.data();

          const outroUsuario =
            conversa.participants.find(
              uid => uid !== user.uid
            );


          const nome =
            conversa.names?.[outroUsuario] ||
            "Usuário";


          const ultimaMensagem =
            conversa.lastMessage ||
            "Nenhuma mensagem";


          const horario =
            conversa.updatedAt
              ? conversa.updatedAt.toDate().toLocaleTimeString(
                  "pt-BR",
                  {
                    hour: "2-digit",
                    minute: "2-digit"
                  }
                )
              : "";


          const item = document.createElement("a");

          item.href =
            `chat.html?id=${doc.id}`;


          item.className =
            "flex items-center gap-3 p-4 hover:bg-gray-50";


          item.innerHTML = `

            <div
              class="w-12 h-12 rounded-full bg-gray-200
                     flex items-center justify-center
                     font-bold text-gray-600"
            >
              ${nome.charAt(0).toUpperCase()}
            </div>

            <div class="flex-1 min-w-0">

              <div class="flex justify-between gap-2">

                <h2 class="font-semibold truncate">
                  ${nome}
                </h2>

                <span class="text-xs text-gray-400">
                  ${horario}
                </span>

              </div>

              <p class="text-sm text-gray-500 truncate">
                ${ultimaMensagem}
              </p>

            </div>

          `;


          lista.appendChild(item);

        });

      });

    });

  </script>

</body>
</html>
