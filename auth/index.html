<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login — VAHUB</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #171717;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: white;
    }

    ::selection {
      background: #ff3008;
      color: white;
    }

    /* =========================
       BACKGROUND
    ========================== */

    .background {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #171717;
    }

    .background img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          rgba(0, 0, 0, .58),
          rgba(0, 0, 0, .72)
        );
    }

    /* =========================
       CONTAINER
    ========================== */

    .page {
      position: relative;
      z-index: 10;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    /* =========================
       LOGIN
    ========================== */

    .login-card {
      width: 100%;
      max-width: 420px;

      padding: 32px;

      background: rgba(23, 23, 23, .86);

      border: 1px solid rgba(255, 255, 255, .10);

      border-radius: 28px;

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, .40),
        inset 0 1px 0 rgba(255, 255, 255, .04);
    }

    /* =========================
       TITLE
    ========================== */

    .title {
      margin-bottom: 28px;
    }

    .title h1 {
      font-size: 28px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -.03em;
    }

    .title p {
      margin-top: 8px;

      font-size: 13px;
      line-height: 1.5;

      color: rgba(255, 255, 255, .42);
    }

    /* =========================
       GOOGLE
    ========================== */

    .google-button {
      width: 100%;
      height: 52px;

      border: 1px solid rgba(255, 255, 255, .10);
      border-radius: 999px;

      background: rgba(255, 255, 255, .045);

      color: white;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;
    }

    .google-button:hover {
      background: rgba(255, 255, 255, .08);

      border-color:
        rgba(255, 255, 255, .16);

      transform: translateY(-1px);
    }

    .google-button:disabled {
      opacity: .5;
      cursor: wait;
      transform: none;
    }

    /* =========================
       STATUS
    ========================== */

    #loginStatus {
      min-height: 18px;

      margin-top: 12px;

      text-align: center;

      font-size: 11px;

      color: rgba(255, 255, 255, .35);
    }

    /* =========================
       VERSION
    ========================== */

    .version {
      margin-top: 26px;

      text-align: center;

      font-size: 9px;

      color: rgba(255, 255, 255, .25);
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 520px) {

      .page {
        padding: 16px;
      }

      .login-card {
        padding: 24px;
        border-radius: 24px;
      }

      .title h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND -->

  <div class="background">

    <img
      src="../assets/images/naruto.webp"
      alt=""
    >

    <div class="overlay"></div>

  </div>


  <!-- PAGE -->

  <main class="page">

    <section class="login-card">

      <!-- TITLE -->

      <div class="title">

        <h1>
          Entrar na sua conta
        </h1>

        <p>
          Acesse sua conta para continuar.
        </p>

      </div>


      <!-- GOOGLE LOGIN -->

      <button
        id="continueWithGoogle"
        type="button"
        class="google-button"
      >
        Continuar com Google
      </button>


      <!-- STATUS -->

      <p id="loginStatus"></p>


      <!-- VERSION -->

      <div class="version">
        VAHUB • v1.0.0
      </div>

    </section>

  </main>


  <!-- CONTROLLER -->

  <script
    type="module"
    src="./sysops.js?v=1.0.3">
  </script>

</body>

</html>
