
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nova conversa</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-900">

  <div class="max-w-md mx-auto min-h-screen bg-white">

    <!-- CABEÇALHO -->
    <header class="p-4 border-b flex items-center gap-3">

      <a
        href="listaconversas.html"
        class="text-gray-500 text-xl"
      >
        ←
      </a>

      <h1 class="text-xl font-bold">
        Nova conversa
      </h1>

    </header>


    <!-- USUÁRIOS -->
    <main id="lista">

      <div class="p-6 text-center text-gray-500">
        Carregando usuários...
      </div>

    </main>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs,
      query,
      where,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


    // =====================================================
    // SUAS CREDENCIAIS FIREBASE
    // =====================================================

    const firebaseConfig = {

     apiKey: "AIzaSyD-xzRjMRVUpey19g745DvPjjpCApqSHVE",
    authDomain: "myops-d7525.firebaseapp.com",
    projectId: "myops-d7525",
    storageBucket: "myops-d7525.firebasestorage.app",
    messagingSenderId: "247824192162",
    appId: "1:247824192162:web:77c91ab1e3df855dc7fdfb"
    };


    // =====================================================
    // FIREBASE
    // =====================================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);


    const lista = document.getElementById("lista");


    // =====================================================
    // USUÁRIO LOGADO
    // =====================================================

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        lista.innerHTML = `
          <div class="p-6 text-center text-gray-500">
            Você precisa estar logado.
          </div>
        `;

        return;
      }


      // ===================================================
      // BUSCAR USUÁRIOS
      // ===================================================

      const snapshot =
        await getDocs(collection(db, "users"));


      lista.innerHTML = "";


      snapshot.forEach((userDoc) => {

        const outro = userDoc.data();

        // Não mostrar a própria conta
        if (userDoc.id === user.uid) return;


        const nome =
          outro.name ||
          outro.nome ||
          "Usuário";


        const item =
          document.createElement("button");


        item.className =
          "w-full flex items-center gap-3 p-4 border-b hover:bg-gray-50 text-left";


        item.innerHTML = `

          <div
            class="w-12 h-12 rounded-full bg-gray-200
                   flex items-center justify-center
                   font-bold text-gray-600"
          >
            ${nome.charAt(0).toUpperCase()}
          </div>

          <div>

            <div class="font-semibold">
              ${nome}
            </div>

            <div class="text-sm text-gray-500">
              Iniciar conversa
            </div>

          </div>

        `;


        // =================================================
        // CLICAR NO USUÁRIO
        // =================================================

        item.onclick = async () => {

          try {

            const ids = [
              user.uid,
              userDoc.id
            ].sort();


            // ID único para os dois usuários
            const conversaId =
              ids.join("_");


            const conversaRef =
              doc(
                db,
                "conversations",
                conversaId
              );


            await setDoc(
              conversaRef,
              {

                participants: ids,

                names: {

                  [user.uid]:
                    user.displayName || "Você",

                  [userDoc.id]:
                    nome

                },

                lastMessage: "",

                updatedAt:
                  serverTimestamp()

              },
              {
                merge: true
              }
            );


            // Abrir conversa
            window.location.href =
              `chat.html?id=${conversaId}`;

          } catch (error) {

            console.error(error);

            alert(
              "Erro ao iniciar conversa."
            );

          }

        };


        lista.appendChild(item);

      });


      if (!lista.children.length) {

        lista.innerHTML = `
          <div class="p-8 text-center text-gray-500">
            Nenhum usuário encontrado.
          </div>
        `;

      }

    });

  </script>

</body>
</html>
