<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Projetos — Vinicius Araujo</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: "class"
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .project-image {
      transition:
        opacity .45s ease,
        transform .7s cubic-bezier(.2,.8,.2,1);
    }

    .project-image.changing {
      opacity: 0;
      transform: scale(.97);
    }

    .project-card {
      transition:
        opacity .3s ease,
        transform .3s ease;
    }

    .project-card:hover .project-image {
      transform: scale(1.025);
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="bg-[#f5f5f3] text-[#171717] antialiased dark:bg-[#0b0b0b] dark:text-white">

  <!-- =========================
       APP
  ========================== -->

  <main class="min-h-screen">

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="fixed left-0 right-0 top-0 z-50">

      <div class="mx-auto flex h-[72px] max-w-[1480px] items-center justify-between px-5 sm:px-8 lg:px-10">

        <!-- VOLTAR -->

        <button
          id="backButton"
          type="button"
          class="group flex items-center gap-3 rounded-full border border-black/10 bg-white/80 px-4 py-2.5 text-[10px] font-semibold backdrop-blur-xl transition hover:-translate-x-0.5 hover:bg-black hover:text-white dark:border-white/10 dark:bg-[#171717]/80 dark:hover:bg-white dark:hover:text-black"
        >

          <span class="text-base leading-none transition group-hover:-translate-x-0.5">
            ←
          </span>

          <span class="hidden sm:inline">
            Voltar
          </span>

        </button>


        <!-- MARCA -->

        <div class="absolute left-1/2 -translate-x-1/2">

          <span class="text-[11px] font-bold tracking-[-.02em]">
            VA
          </span>

        </div>


        <!-- CONTADOR -->

        <div class="flex items-center gap-2">

          <span
            id="currentNumber"
            class="text-[10px] font-semibold"
          >
            01
          </span>

          <span class="text-[10px] text-black/25 dark:text-white/25">
            /
          </span>

          <span class="text-[10px] text-black/35 dark:text-white/35">
            09
          </span>

        </div>

      </div>

    </header>


    <!-- =========================
         CONTEÚDO
    ========================== -->

    <section class="mx-auto flex min-h-screen max-w-[1480px] flex-col px-3 pb-8 pt-[92px] sm:px-8 lg:px-10">

      <!-- PROJETO PRINCIPAL -->

      <div class="relative flex min-h-[calc(100vh-124px)] flex-1 flex-col">

        <!-- IMAGEM -->

        <div
          id="projectCard"
          class="project-card relative min-h-0 flex-1 overflow-hidden rounded-[28px] border border-black/10 bg-white shadow-sm dark:border-white/10 dark:bg-[#151515] sm:rounded-[34px]"
        >

          <img
            id="projectImage"
            src="./assets/images/morren.png"
            alt="Morren Studios"
            class="project-image absolute inset-0 h-full w-full object-cover"
          >


          <!-- GRADIENTE -->

          <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/10 to-transparent"></div>


          <!-- CATEGORIA -->

          <div class="absolute left-5 top-5 sm:left-7 sm:top-7">

            <span
              id="projectCategory"
              class="rounded-full border border-white/15 bg-black/20 px-3 py-2 text-[8px] font-semibold uppercase tracking-[.18em] text-white backdrop-blur-xl"
            >
              Branding
            </span>

          </div>


          <!-- CONTEÚDO -->

          <div class="absolute bottom-5 left-5 right-5 sm:bottom-7 sm:left-7 sm:right-7">

            <div class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">

              <div>

                <h1
                  id="projectTitle"
                  class="text-[42px] font-medium leading-[.88] tracking-[-.065em] text-white sm:text-[64px] lg:text-[82px]"
                >
                  Morren Studios
                </h1>

              </div>


              <!-- CTA -->

              <button
                id="viewProject"
                type="button"
                class="group inline-flex w-fit items-center gap-4 rounded-full bg-white py-2.5 pl-5 pr-2.5 text-[10px] font-bold text-[#171717] transition hover:-translate-y-1 hover:shadow-2xl"
              >

                <span>
                  Ver projeto
                </span>

                <span class="grid h-9 w-9 place-items-center rounded-full bg-[#ff3008] text-white transition group-hover:rotate-45">
                  ↗
                </span>

              </button>

            </div>

          </div>

        </div>


        <!-- =========================
             NAVEGAÇÃO
        ========================== -->

        <div class="flex items-center justify-between pt-4">

          <!-- PROJETO ANTERIOR -->

          <button
            id="prevButton"
            type="button"
            class="group flex items-center gap-2 rounded-full border border-black/10 bg-white px-4 py-2.5 text-[9px] font-semibold transition hover:bg-black hover:text-white dark:border-white/10 dark:bg-white/5 dark:hover:bg-white dark:hover:text-black"
          >

            <span class="text-sm transition group-hover:-translate-x-1">
              ←
            </span>

            <span class="hidden sm:inline">
              Anterior
            </span>

          </button>


          <!-- MINI ÍNDICE -->

          <div
            id="dots"
            class="hide-scrollbar flex max-w-[45vw] items-center gap-1.5 overflow-x-auto px-2"
          >

            <!-- JS -->

          </div>


          <!-- PRÓXIMO -->

          <button
            id="nextButton"
            type="button"
            class="group flex items-center gap-2 rounded-full border border-black/10 bg-white px-4 py-2.5 text-[9px] font-semibold transition hover:bg-black hover:text-white dark:border-white/10 dark:bg-white/5 dark:hover:bg-white dark:hover:text-black"
          >

            <span class="hidden sm:inline">
              Próximo
            </span>

            <span class="text-sm transition group-hover:translate-x-1">
              →
            </span>

          </button>

        </div>

      </div>

    </section>


    <!-- =========================
         MOBILE CTA
    ========================== -->

    <div class="fixed bottom-5 left-1/2 z-40 hidden -translate-x-1/2 sm:hidden">

      <button
        id="mobileContact"
        type="button"
        class="rounded-full bg-[#ff3008] px-6 py-3 text-[10px] font-bold text-white shadow-2xl"
      >
        Quero um projeto
      </button>

    </div>

  </main>


  <!-- =========================
       MODAL PREVIEW
  ========================== -->

  <div
    id="previewModal"
    class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 p-3 backdrop-blur-xl sm:p-6"
  >

    <div class="relative flex h-full max-h-[92vh] w-full max-w-[1400px] flex-col overflow-hidden rounded-[28px] border border-white/10 bg-[#111] shadow-2xl">

      <!-- HEADER MODAL -->

      <div class="flex h-16 shrink-0 items-center justify-between border-b border-white/10 px-4 sm:px-6">

        <div>

          <p class="text-[8px] uppercase tracking-[.2em] text-white/35">
            Preview
          </p>

          <p
            id="previewTitle"
            class="mt-1 text-xs font-semibold text-white"
          >
            Morren Studios
          </p>

        </div>


        <button
          id="closePreview"
          type="button"
          class="grid h-9 w-9 place-items-center rounded-full border border-white/10 text-white/70 transition hover:bg-white hover:text-black"
        >
          ×
        </button>

      </div>


      <!-- PREVIEW -->

      <div class="flex flex-1 items-center justify-center overflow-auto bg-[#090909] p-3 sm:p-8">

        <div
          id="previewFrame"
          class="relative aspect-[16/10] w-full max-w-[1100px] overflow-hidden rounded-2xl bg-white shadow-2xl"
        >

          <img
            id="previewImage"
            src="./assets/images/morren.png"
            alt=""
            class="h-full w-full object-cover"
          >

        </div>

      </div>


      <!-- FOOTER MODAL -->

      <div class="flex shrink-0 items-center justify-between border-t border-white/10 px-4 py-4 sm:px-6">

        <span class="text-[8px] uppercase tracking-[.2em] text-white/30">
          Projeto
        </span>

        <button
          type="button"
          id="modalContact"
          class="rounded-full bg-[#ff3008] px-5 py-2.5 text-[9px] font-bold text-white transition hover:-translate-y-0.5"
        >
          Quero um projeto
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    const projects = [

      {
        title: "Morren Studios",
        category: "Branding",
        image: "./assets/images/morren.png"
      },

      {
        title: "Buyed",
        category: "Digital",
        image: "./assets/images/buyed.png"
      },

      {
        title: "Tudo pra Ela",
        category: "E-commerce",
        image: "./assets/images/tudoela.png"
      },

      {
        title: "Iloveimportados",
        category: "Branding",
        image: "./assets/images/love.png"
      },

      {
        title: "OMDA Tracker",
        category: "Software",
        image: "./assets/images/omda.png"
      },

      {
        title: "Experiência Digital",
        category: "Digital",
        image: "./assets/images/im-2.webp"
      },

      {
        title: "Projeto 07",
        category: "Software",
        image: "./assets/images/omda.png"
      },

      {
        title: "Projeto 08",
        category: "Digital",
        image: "./assets/images/im-2.webp"
      },

      {
        title: "Projeto 09",
        category: "Branding",
        image: "./assets/images/morren.png"
      }

    ];


    let currentIndex = 0;


    const projectImage =
      document.getElementById("projectImage");

    const projectTitle =
      document.getElementById("projectTitle");

    const projectCategory =
      document.getElementById("projectCategory");

    const currentNumber =
      document.getElementById("currentNumber");

    const dots =
      document.getElementById("dots");


    const previewModal =
      document.getElementById("previewModal");

    const previewImage =
      document.getElementById("previewImage");

    const previewTitle =
      document.getElementById("previewTitle");


    /* =========================
       DOTS
    ========================== */

    function createDots() {

      dots.innerHTML = "";

      projects.forEach((project, index) => {

        const button =
          document.createElement("button");

        button.type = "button";

        button.className =
          "h-1.5 w-1.5 shrink-0 rounded-full transition-all";

        button.addEventListener(
          "click",
          () => goTo(index)
        );

        dots.appendChild(button);

      });

      updateDots();

    }


    function updateDots() {

      [...dots.children].forEach(
        (dot, index) => {

          if (index === currentIndex) {

            dot.className =
              "h-1.5 w-5 shrink-0 rounded-full bg-[#ff3008] transition-all";

          } else {

            dot.className =
              "h-1.5 w-1.5 shrink-0 rounded-full bg-black/20 transition-all dark:bg-white/20";

          }

        }
      );

    }


    /* =========================
       PROJETO
    ========================== */

    function renderProject() {

      const project =
        projects[currentIndex];


      projectImage.classList.add("changing");


      setTimeout(() => {

        projectImage.src =
          project.image;

        projectImage.alt =
          project.title;

        projectTitle.textContent =
          project.title;

        projectCategory.textContent =
          project.category;

        currentNumber.textContent =
          String(currentIndex + 1)
            .padStart(2, "0");

        previewImage.src =
          project.image;

        previewImage.alt =
          project.title;

        previewTitle.textContent =
          project.title;


        projectImage.onload = () => {

          projectImage.classList.remove(
            "changing"
          );

        };

      }, 220);


      updateDots();

    }


    function goTo(index) {

      if (index < 0) {

        currentIndex =
          projects.length - 1;

      } else if (index >= projects.length) {

        currentIndex = 0;

      } else {

        currentIndex = index;

      }

      renderProject();

    }


    document
      .getElementById("prevButton")
      .addEventListener(
        "click",
        () => goTo(currentIndex - 1)
      );


    document
      .getElementById("nextButton")
      .addEventListener(
        "click",
        () => goTo(currentIndex + 1)
      );


    /* =========================
       VOLTAR
    ========================== */

    document
      .getElementById("backButton")
      .addEventListener(
        "click",
        () => {

          if (window.history.length > 1) {

            window.history.back();

          } else {

            window.location.href = "./";

          }

        }
      );


    /* =========================
       PREVIEW
    ========================== */

    document
      .getElementById("viewProject")
      .addEventListener(
        "click",
        () => {

          previewModal.classList.remove("hidden");

          previewModal.classList.add("flex");

          document.body.style.overflow =
            "hidden";

        }
      );


    document
      .getElementById("closePreview")
      .addEventListener(
        "click",
        closePreview
      );


    previewModal
      .addEventListener(
        "click",
        event => {

          if (
            event.target === previewModal
          ) {

            closePreview();

          }

        }
      );


    function closePreview() {

      previewModal.classList.add("hidden");

      previewModal.classList.remove("flex");

      document.body.style.overflow = "";

    }


    /* =========================
       TECLADO
    ========================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "ArrowLeft"
        ) {

          goTo(currentIndex - 1);

        }

        if (
          event.key === "ArrowRight"
        ) {

          goTo(currentIndex + 1);

        }

        if (
          event.key === "Escape"
        ) {

          closePreview();

        }

      }
    );


    /* =========================
       SWIPE MOBILE
    ========================== */

    let touchStartX = 0;
    let touchEndX = 0;


    document
      .getElementById("projectCard")
      .addEventListener(
        "touchstart",
        event => {

          touchStartX =
            event.changedTouches[0].screenX;

        },
        {
          passive: true
        }
      );


    document
      .getElementById("projectCard")
      .addEventListener(
        "touchend",
        event => {

          touchEndX =
            event.changedTouches[0].screenX;

          const distance =
            touchEndX - touchStartX;


          if (Math.abs(distance) < 50) {
            return;
          }


          if (distance < 0) {

            goTo(currentIndex + 1);

          } else {

            goTo(currentIndex - 1);

          }

        },
        {
          passive: true
        }
      );


    /* =========================
       INIT
    ========================== */

    createDots();
    renderProject();

  </script>

</body>
</html>
