  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    /*
      CONFIGURAÇÃO DOS DISPOSITIVOS
    */

    const devices = {

      desktop: {
        name: "Desktop",
        width: "100%",
        maxWidth: "1440px"
      },

      tablet: {
        name: "Tablet",
        width: "768px",
        maxWidth: "768px"
      },

      mobile: {
        name: "Mobile",
        width: "390px",
        maxWidth: "390px"
      }

    };


    /*
      ELEMENTOS
    */

    const modal =
      document.getElementById("previewModal");

    const frame =
      document.getElementById("previewFrame");

    const deviceFrame =
      document.getElementById("deviceFrame");

    const deviceInfo =
      document.getElementById("deviceInfo");


    /*
      ABRIR
    */

    function openPreview() {

      modal.classList.remove("hidden");

      document.body.classList.add("overflow-hidden");

      /*
        Pega o HTML existente no template
        e transforma em uma página dentro
        do iframe.
      */

      const template =
        document.getElementById("demoSite");

      const html =
        template.innerHTML;

      frame.srcdoc = html;

      setDevice("desktop");

    }


    /*
      FECHAR
    */

    function closePreview() {

      modal.classList.add("hidden");

      document.body.classList.remove("overflow-hidden");

      frame.srcdoc = "";

    }


    /*
      ALTERAR DISPOSITIVO
    */

    function setDevice(device) {

      const config =
        devices[device];

      if (!config) return;


      /*
        DESKTOP
      */

      if (device === "desktop") {

        deviceFrame.style.width = "100%";

        deviceFrame.style.maxWidth =
          config.maxWidth;

        deviceFrame.classList.remove(
          "rounded-[2rem]",
          "border-[8px]",
          "border-neutral-900"
        );

      }


      /*
        TABLET
      */

      if (device === "tablet") {

        deviceFrame.style.width =
          config.width;

        deviceFrame.style.maxWidth =
          config.maxWidth;

        deviceFrame.classList.add(
          "rounded-2xl"
        );

        deviceFrame.classList.remove(
          "border-[8px]",
          "border-neutral-900"
        );

      }


      /*
        MOBILE
      */

      if (device === "mobile") {

        deviceFrame.style.width =
          config.width;

        deviceFrame.style.maxWidth =
          config.maxWidth;

        deviceFrame.classList.add(
          "rounded-[2rem]",
          "border-[8px]",
          "border-neutral-900"
        );

      }


      /*
        LABEL
      */

      deviceInfo.textContent =
        `${config.name} · ${
          device === "desktop"
            ? "1440px"
            : config.width
        }`;


      /*
        BOTÕES
      */

      document
        .querySelectorAll(".device-button")
        .forEach(button => {

          button.classList.remove(
            "bg-white",
            "text-neutral-900",
            "shadow-sm"
          );

          button.classList.add(
            "text-neutral-500"
          );

        });


      const active =
        document.getElementById(
          `device-${device}`
        );


      active.classList.remove(
        "text-neutral-500"
      );

      active.classList.add(
        "bg-white",
        "text-neutral-900",
        "shadow-sm"
      );

    }


    /*
      ESC
    */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {
          closePreview();
        }

      }
    );


    /*
      CLIQUE NO FUNDO
    */

    modal.addEventListener(
      "click",
      function(event) {

        if (event.target === modal) {
          closePreview();
        }

      }
    );

  </script>
