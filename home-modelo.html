<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Projetos — Vinicius Araujo</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: "class"
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      overflow-x: hidden;
      background: #f5f5f3;
    }

    .project-image {
      transition:
        opacity .4s ease,
        transform .7s cubic-bezier(.2,.8,.2,1);
    }

    .project-image.changing {
      opacity: 0;
      transform: scale(.975);
    }

    .project-card {
      transition:
        transform .35s ease,
        box-shadow .35s ease;
    }

    .project-card:hover .project-image {
      transform: scale(1.025);
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .preview-device {
      transition:
        width .45s cubic-bezier(.2,.8,.2,1),
        height .45s cubic-bezier(.2,.8,.2,1),
        border-radius .35s ease;
    }

    .preview-image {
      transition:
        opacity .25s ease,
        transform .4s ease;
    }

    .modal-enter {
      animation: modalIn .3s ease forwards;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(.97);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .fade-up {
      animation: fadeUp .45s ease forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>


<body class="bg-[#f5f5f3] text-[#171717] antialiased dark:bg-[#0b0b0b] dark:text-white">

  <!-- =====================================================
       APP
  ====================================================== -->

  <main class="min-h-screen">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="fixed inset-x-0 top-0 z-50">

      <div
        class="mx-auto flex h-[72px] max-w-[1480px] items-center justify-between px-4 sm:px-8 lg:px-10"
      >

        <!-- VOLTAR -->

        <button
          id="backButton"
          type="button"
          aria-label="Voltar"
          class="group flex h-10 items-center gap-2 rounded-full border border-black/10 bg-white/80 px-4 text-[10px] font-semibold backdrop-blur-xl transition hover:-translate-x-0.5 hover:bg-black hover:text-white dark:border-white/10 dark:bg-[#171717]/80 dark:hover:bg-white dark:hover:text-black"
        >

          <span
            class="text-base leading-none transition group-hover:-translate-x-0.5"
          >
            ←
          </span>

          <span class="hidden sm:inline">
            Voltar
          </span>

        </button>


        <!-- MARCA -->

        <div
          class="absolute left-1/2 -translate-x-1/2"
        >

          <span
            class="text-[11px] font-bold tracking-[-.04em]"
          >
            VA
          </span>

        </div>


        <!-- CONTADOR -->

        <div class="flex items-center gap-2">

          <span
            id="currentNumber"
            class="text-[10px] font-bold"
          >
            01
          </span>

          <span class="text-[10px] text-black/20 dark:text-white/20">
            /
          </span>

          <span
            id="totalNumber"
            class="text-[10px] text-black/35 dark:text-white/35"
          >
            09
          </span>

        </div>

      </div>

    </header>


    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <section
      class="mx-auto flex min-h-screen max-w-[1480px] flex-col px-3 pb-5 pt-[82px] sm:px-8 sm:pb-7 lg:px-10"
    >

      <div
        class="relative flex min-h-[calc(100vh-102px)] flex-1 flex-col"
      >


        <!-- =================================================
             PROJETO
        ================================================== -->

        <div
          id="projectCard"
          class="project-card relative min-h-0 flex-1 cursor-grab overflow-hidden rounded-[26px] border border-black/10 bg-white shadow-sm active:cursor-grabbing dark:border-white/10 dark:bg-[#151515] sm:rounded-[34px]"
        >

          <!-- IMAGEM -->

          <img
            id="projectImage"
            src="./assets/images/morren.png"
            alt="Morren Studios"
            draggable="false"
            class="project-image absolute inset-0 h-full w-full select-none object-cover"
          >


          <!-- GRADIENTE -->

          <div
            class="pointer-events-none absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-black/5"
          ></div>


          <!-- TOPO DO PROJETO -->

          <div
            class="absolute left-4 right-4 top-4 flex items-start justify-between sm:left-7 sm:right-7 sm:top-7"
          >

            <!-- CATEGORIA -->

            <span
              id="projectCategory"
              class="rounded-full border border-white/15 bg-black/20 px-3 py-2 text-[8px] font-semibold uppercase tracking-[.18em] text-white backdrop-blur-xl"
            >
              Branding
            </span>


            <!-- NÚMERO -->

            <span
              id="projectIndex"
              class="rounded-full border border-white/15 bg-black/20 px-3 py-2 text-[8px] font-semibold text-white backdrop-blur-xl"
            >
              01
            </span>

          </div>


          <!-- CONTEÚDO INFERIOR -->

          <div
            class="absolute bottom-4 left-4 right-4 sm:bottom-7 sm:left-7 sm:right-7"
          >

            <div
              class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between"
            >

              <!-- TÍTULO -->

              <div class="min-w-0">

                <p
                  class="mb-2 text-[8px] font-semibold uppercase tracking-[.2em] text-white/50"
                >
                  Projeto
                </p>

                <h1
                  id="projectTitle"
                  class="max-w-[900px] text-[42px] font-medium leading-[.88] tracking-[-.065em] text-white sm:text-[64px] lg:text-[82px]"
                >
                  Morren Studios
                </h1>

              </div>


              <!-- CTA -->

              <button
                id="viewProject"
                type="button"
                class="group inline-flex w-fit shrink-0 items-center gap-4 rounded-full bg-white py-2.5 pl-5 pr-2.5 text-[10px] font-bold text-[#171717] transition hover:-translate-y-1 hover:shadow-2xl"
              >

                <span>
                  Ver projeto
                </span>

                <span
                  class="grid h-9 w-9 place-items-center rounded-full bg-[#ff3008] text-white transition duration-300 group-hover:rotate-45"
                >
                  ↗
                </span>

              </button>

            </div>

          </div>

        </div>


        <!-- =================================================
             NAVEGAÇÃO
        ================================================== -->

        <div
          class="flex shrink-0 items-center justify-between pt-3 sm:pt-4"
        >

          <!-- ANTERIOR -->

          <button
            id="prevButton"
            type="button"
            aria-label="Projeto anterior"
            class="group flex h-10 items-center gap-2 rounded-full border border-black/10 bg-white px-4 text-[9px] font-semibold transition hover:bg-black hover:text-white dark:border-white/10 dark:bg-white/5 dark:hover:bg-white dark:hover:text-black"
          >

            <span
              class="text-sm transition group-hover:-translate-x-1"
            >
              ←
            </span>

            <span class="hidden sm:inline">
              Anterior
            </span>

          </button>


          <!-- INDICADORES -->

          <div
            id="dots"
            class="hide-scrollbar flex max-w-[48vw] items-center gap-1.5 overflow-x-auto px-3"
          ></div>


          <!-- PRÓXIMO -->

          <button
            id="nextButton"
            type="button"
            aria-label="Próximo projeto"
            class="group flex h-10 items-center gap-2 rounded-full border border-black/10 bg-white px-4 text-[9px] font-semibold transition hover:bg-black hover:text-white dark:border-white/10 dark:bg-white/5 dark:hover:bg-white dark:hover:text-black"
          >

            <span class="hidden sm:inline">
              Próximo
            </span>

            <span
              class="text-sm transition group-hover:translate-x-1"
            >
              →
            </span>

          </button>

        </div>

      </div>

    </section>


    <!-- =====================================================
         MOBILE CTA
    ====================================================== -->

    <div
      class="fixed bottom-5 left-1/2 z-40 hidden -translate-x-1/2 sm:hidden"
    >

      <button
        id="mobileContact"
        type="button"
        class="rounded-full bg-[#ff3008] px-6 py-3 text-[10px] font-bold text-white shadow-2xl"
      >
        Quero um projeto
      </button>

    </div>

  </main>


  <!-- =====================================================
       MODAL PREVIEW
  ====================================================== -->

  <div
    id="previewModal"
    class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/85 p-2 backdrop-blur-xl sm:p-5"
  >

    <div
      id="previewModalContent"
      class="modal-enter relative flex h-full max-h-[94vh] w-full max-w-[1450px] flex-col overflow-hidden rounded-[24px] border border-white/10 bg-[#111] shadow-2xl sm:rounded-[30px]"
    >


      <!-- =================================================
           HEADER
      ================================================== -->

      <div
        class="flex h-[62px] shrink-0 items-center justify-between border-b border-white/10 px-4 sm:h-[68px] sm:px-6"
      >

        <div>

          <p
            class="text-[8px] uppercase tracking-[.2em] text-white/35"
          >
            Preview
          </p>

          <p
            id="previewTitle"
            class="mt-1 text-xs font-semibold text-white"
          >
            Morren Studios
          </p>

        </div>


        <!-- CONTROLES DE DISPOSITIVO -->

        <div
          class="hidden items-center gap-1 rounded-full border border-white/10 bg-white/5 p-1 sm:flex"
        >

          <button
            type="button"
            data-device="desktop"
            class="deviceButton rounded-full bg-white px-3 py-2 text-[8px] font-bold text-black"
          >
            Desktop
          </button>

          <button
            type="button"
            data-device="tablet"
            class="deviceButton rounded-full px-3 py-2 text-[8px] font-bold text-white/50 transition hover:text-white"
          >
            Tablet
          </button>

          <button
            type="button"
            data-device="mobile"
            class="deviceButton rounded-full px-3 py-2 text-[8px] font-bold text-white/50 transition hover:text-white"
          >
            Mobile
          </button>

        </div>


        <!-- FECHAR -->

        <button
          id="closePreview"
          type="button"
          aria-label="Fechar preview"
          class="grid h-9 w-9 place-items-center rounded-full border border-white/10 text-lg text-white/70 transition hover:bg-white hover:text-black"
        >
          ×
        </button>

      </div>


      <!-- =================================================
           PREVIEW AREA
      ================================================== -->

      <div
        class="flex flex-1 items-center justify-center overflow-auto bg-[#090909] p-3 sm:p-8"
      >

        <div
          id="previewFrame"
          class="preview-device relative h-full max-h-[700px] w-full max-w-[1100px] overflow-hidden rounded-2xl bg-white shadow-2xl"
        >

          <img
            id="previewImage"
            src="./assets/images/morren.png"
            alt="Morren Studios"
            class="preview-image h-full w-full object-cover"
          >

        </div>

      </div>


      <!-- =================================================
           FOOTER
      ================================================== -->

      <div
        class="flex shrink-0 items-center justify-between border-t border-white/10 px-4 py-3 sm:px-6 sm:py-4"
      >

        <div class="hidden sm:block">

          <span
            class="text-[8px] uppercase tracking-[.2em] text-white/30"
          >
            Projeto
          </span>

        </div>


        <div class="ml-auto flex items-center gap-2">

          <button
            id="modalContact"
            type="button"
            class="rounded-full bg-[#ff3008] px-5 py-2.5 text-[9px] font-bold text-white transition hover:-translate-y-0.5"
          >
            Quero um projeto
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    /* =====================================================
       PROJETOS
    ====================================================== */

    const projects = [

      {
        title: "Morren Studios",
        category: "Branding",
        image: "./assets/images/morren.png"
      },

      {
        title: "Buyed",
        category: "Digital",
        image: "./assets/images/buyed.png"
      },

      {
        title: "Tudo pra Ela",
        category: "E-commerce",
        image: "./assets/images/tudoela.png"
      },

      {
        title: "Iloveimportados",
        category: "Branding",
        image: "./assets/images/love.png"
      },

      {
        title: "OMDA Tracker",
        category: "Software",
        image: "./assets/images/omda.png"
      },

      {
        title: "Experiência Digital",
        category: "Digital",
        image: "./assets/images/im-2.webp"
      },

      {
        title: "Projeto 07",
        category: "Software",
        image: "./assets/images/omda.png"
      },

      {
        title: "Projeto 08",
        category: "Digital",
        image: "./assets/images/im-2.webp"
      },

      {
        title: "Projeto 09",
        category: "Branding",
        image: "./assets/images/morren.png"
      }

    ];


    /* =====================================================
       ESTADO
    ====================================================== */

    let currentIndex = 0;

    let touchStartX = 0;
    let touchEndX = 0;


    /* =====================================================
       ELEMENTOS
    ====================================================== */

    const projectCard =
      document.getElementById("projectCard");

    const projectImage =
      document.getElementById("projectImage");

    const projectTitle =
      document.getElementById("projectTitle");

    const projectCategory =
      document.getElementById("projectCategory");

    const projectIndex =
      document.getElementById("projectIndex");

    const currentNumber =
      document.getElementById("currentNumber");

    const totalNumber =
      document.getElementById("totalNumber");

    const dots =
      document.getElementById("dots");


    const previewModal =
      document.getElementById("previewModal");

    const previewImage =
      document.getElementById("previewImage");

    const previewTitle =
      document.getElementById("previewTitle");

    const previewFrame =
      document.getElementById("previewFrame");


    /* =====================================================
       HELPERS
    ====================================================== */

    function formatNumber(number) {

      return String(number)
        .padStart(2, "0");

    }


    /* =====================================================
       DOTS
    ====================================================== */

    function createDots() {

      dots.innerHTML = "";

      projects.forEach((project, index) => {

        const button =
          document.createElement("button");

        button.type = "button";

        button.setAttribute(
          "aria-label",
          `Ir para ${project.title}`
        );

        button.className =
          "h-1.5 w-1.5 shrink-0 rounded-full bg-black/20 transition-all dark:bg-white/20";

        button.addEventListener(
          "click",
          () => goTo(index)
        );

        dots.appendChild(button);

      });

      updateDots();

    }


    function updateDots() {

      [...dots.children].forEach(
        (dot, index) => {

          if (index === currentIndex) {

            dot.className =
              "h-1.5 w-5 shrink-0 rounded-full bg-[#ff3008] transition-all";

          } else {

            dot.className =
              "h-1.5 w-1.5 shrink-0 rounded-full bg-black/20 transition-all dark:bg-white/20";

          }

        }
      );

    }


    /* =====================================================
       RENDER PROJETO
    ====================================================== */

    function renderProject() {

      const project =
        projects[currentIndex];


      projectImage.classList.add("changing");


      setTimeout(() => {

        projectImage.src =
          project.image;

        projectImage.alt =
          project.title;

        projectTitle.textContent =
          project.title;

        projectCategory.textContent =
          project.category;

        projectIndex.textContent =
          formatNumber(currentIndex + 1);

        currentNumber.textContent =
          formatNumber(currentIndex + 1);

        totalNumber.textContent =
          formatNumber(projects.length);

        previewImage.src =
          project.image;

        previewImage.alt =
          project.title;

        previewTitle.textContent =
          project.title;


        projectImage.onload = () => {

          projectImage.classList.remove(
            "changing"
          );

        };


        setTimeout(() => {

          projectImage.classList.remove(
            "changing"
          );

        }, 500);

      }, 180);


      updateDots();

    }


    /* =====================================================
       NAVEGAÇÃO
    ====================================================== */

    function goTo(index) {

      if (index < 0) {

        currentIndex =
          projects.length - 1;

      } else if (index >= projects.length) {

        currentIndex = 0;

      } else {

        currentIndex = index;

      }

      renderProject();

    }


    document
      .getElementById("prevButton")
      .addEventListener(
        "click",
        () => goTo(currentIndex - 1)
      );


    document
      .getElementById("nextButton")
      .addEventListener(
        "click",
        () => goTo(currentIndex + 1)
      );


    /* =====================================================
       VOLTAR
    ====================================================== */

    document
      .getElementById("backButton")
      .addEventListener(
        "click",
        () => {

          if (window.history.length > 1) {

            window.history.back();

          } else {

            window.location.href = "./";

          }

        }
      );


    /* =====================================================
       PREVIEW
    ====================================================== */

    function openPreview() {

      previewModal.classList.remove(
        "hidden"
      );

      previewModal.classList.add(
        "flex"
      );

      document.body.style.overflow =
        "hidden";

      previewTitle.textContent =
        projects[currentIndex].title;

      previewImage.src =
        projects[currentIndex].image;

      previewImage.alt =
        projects[currentIndex].title;

      setDevice("desktop");

    }


    function closePreview() {

      previewModal.classList.add(
        "hidden"
      );

      previewModal.classList.remove(
        "flex"
      );

      document.body.style.overflow =
        "";

    }


    document
      .getElementById("viewProject")
      .addEventListener(
        "click",
        openPreview
      );


    document
      .getElementById("closePreview")
      .addEventListener(
        "click",
        closePreview
      );


    document
      .getElementById("modalContact")
      .addEventListener(
        "click",
        () => {

          const message =
            encodeURIComponent(
              "Olá, Vinicius. Vi seus projetos e quero conversar sobre um projeto."
            );

          window.open(
            `https://wa.me/?text=${message}`,
            "_blank"
          );

        }
      );


    document
      .getElementById("mobileContact")
      .addEventListener(
        "click",
        () => {

          const message =
            encodeURIComponent(
              "Olá, Vinicius. Vi seus projetos e quero conversar sobre um projeto."
            );

          window.open(
            `https://wa.me/?text=${message}`,
            "_blank"
          );

        }
      );


    /* =====================================================
       FECHAR MODAL CLICANDO FORA
    ====================================================== */

    previewModal.addEventListener(
      "click",
      event => {

        if (
          event.target === previewModal
        ) {

          closePreview();

        }

      }
    );


    /* =====================================================
       DISPOSITIVOS
    ====================================================== */

    function setDevice(device) {

      if (device === "desktop") {

        previewFrame.style.width =
          "100%";

        previewFrame.style.height =
          "100%";

        previewFrame.style.maxWidth =
          "1100px";

        previewFrame.style.maxHeight =
          "700px";

        previewFrame.style.borderRadius =
          "16px";

      }


      if (device === "tablet") {

        previewFrame.style.width =
          "768px";

        previewFrame.style.height =
          "1024px";

        previewFrame.style.maxWidth =
          "90%";

        previewFrame.style.maxHeight =
          "90%";

        previewFrame.style.borderRadius =
          "20px";

      }


      if (device === "mobile") {

        previewFrame.style.width =
          "390px";

        previewFrame.style.height =
          "844px";

        previewFrame.style.maxWidth =
          "88%";

        previewFrame.style.maxHeight =
          "90%";

        previewFrame.style.borderRadius =
          "28px";

      }


      document
        .querySelectorAll(".deviceButton")
        .forEach(button => {

          const active =
            button.dataset.device === device;

          if (active) {

            button.className =
              "deviceButton rounded-full bg-white px-3 py-2 text-[8px] font-bold text-black";

          } else {

            button.className =
              "deviceButton rounded-full px-3 py-2 text-[8px] font-bold text-white/50 transition hover:text-white";

          }

        });

    }


    document
      .querySelectorAll(".deviceButton")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            setDevice(
              button.dataset.device
            );

          }
        );

      });


    /* =====================================================
       TECLADO
    ====================================================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "ArrowLeft"
        ) {

          goTo(currentIndex - 1);

        }


        if (
          event.key === "ArrowRight"
        ) {

          goTo(currentIndex + 1);

        }


        if (
          event.key === "Escape"
        ) {

          closePreview();

        }

      }
    );


    /* =====================================================
       SWIPE MOBILE
    ====================================================== */

    projectCard.addEventListener(
      "touchstart",
      event => {

        touchStartX =
          event.changedTouches[0].screenX;

      },
      {
        passive: true
      }
    );


    projectCard.addEventListener(
      "touchend",
      event => {

        touchEndX =
          event.changedTouches[0].screenX;

        const distance =
          touchEndX - touchStartX;


        if (
          Math.abs(distance) < 50
        ) {

          return;

        }


        if (distance < 0) {

          goTo(currentIndex + 1);

        } else {

          goTo(currentIndex - 1);

        }

      },
      {
        passive: true
      }
    );


    /* =====================================================
       INIT
    ====================================================== */

    createDots();

    renderProject();

  </script>

</body>
</html>
