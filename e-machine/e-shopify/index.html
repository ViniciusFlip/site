
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store — Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;color:#171717}*{box-sizing:border-box}.btn{background:#171717;color:white;padding:12px 20px;font-size:12px;border-radius:4px}.announcement{background:#ec1763;color:white}</style>
</head>
<body>
<div class="announcement text-center text-xs py-2" data-i="announce"></div>
<header class="border-b"><div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
<button id="menu" class="md:hidden">☰</button><a href="index.html" class="text-xl font-extrabold">STORE.</a>
<nav class="hidden md:flex gap-6 text-xs"><a href="list.html" data-i="shop"></a><a href="#categories" data-i="categories"></a><a href="#story" data-i="story"></a></nav>
<div class="flex gap-3 text-sm"><select id="lang" class="bg-transparent text-xs"><option value="pt">PT</option><option value="en">EN</option></select><a href="list.html">⌕</a><a href="details.html">♡</a><a href="details.html">Bag</a></div>
</div><nav id="mobileMenu" class="hidden md:hidden px-4 pb-4 text-sm space-y-3"><a class="block" href="list.html" data-i="shop"></a><a class="block" href="#categories" data-i="categories"></a><a class="block" href="#story" data-i="story"></a></nav></header>
<section class="max-w-7xl mx-auto px-4 py-6"><a href="list.html"><img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1800&auto=format&fit=crop&q=85" class="w-full h-[420px] md:h-[600px] object-cover rounded" alt="Campaign"></a><div class="mt-5"><p class="text-xs uppercase tracking-widest" data-i="heroTag"></p><h1 class="text-3xl md:text-5xl font-bold mt-2" data-i="hero"></h1><a href="list.html" class="btn inline-block mt-5" data-i="shopNow"></a></div></section>
<section id="categories" class="max-w-7xl mx-auto px-4 py-12"><h2 class="text-xl font-bold mb-6" data-i="categoryTitle"></h2><div class="grid grid-cols-2 md:grid-cols-4 gap-3"><a href="list.html?category=1"><img class="w-full aspect-square object-cover" src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=600&q=80"><p class="text-xs mt-2" data-i="cat1"></p></a><a href="list.html?category=2"><img class="w-full aspect-square object-cover" src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600&q=80"><p class="text-xs mt-2" data-i="cat2"></p></a><a href="list.html?category=3"><img class="w-full aspect-square object-cover" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&q=80"><p class="text-xs mt-2" data-i="cat3"></p></a><a href="list.html?category=4"><img class="w-full aspect-square object-cover" src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=600&q=80"><p class="text-xs mt-2" data-i="cat4"></p></a></div></section>
<section class="max-w-7xl mx-auto px-4 py-12"><div class="flex justify-between items-center mb-6"><h2 class="text-xl font-bold" data-i="best"></h2><a href="list.html" class="text-xs underline" data-i="viewAll"></a></div><div id="products" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div></section>
<section class="max-w-7xl mx-auto px-4 py-10"><a href="list.html"><img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1600&q=85" class="w-full h-64 md:h-96 object-cover rounded"></a><h2 class="text-2xl font-bold mt-5" data-i="campaign"></h2><a href="list.html" class="btn inline-block mt-4" data-i="shopNow"></a></section>
<section id="story" class="bg-gray-50 py-14 px-4 text-center"><h2 class="text-2xl font-bold" data-i="storyTitle"></h2><p class="text-sm text-gray-500 mt-3" data-i="storyText"></p></section>
<footer class="border-t px-4 py-10 text-xs grid grid-cols-2 md:grid-cols-4 gap-8"><div><b>STORE.</b><p class="mt-3 text-gray-500" data-i="tagline"></p></div><div><b data-i="shop"></b><a href="list.html" class="block mt-3" data-i="allProducts"></a></div><div><b data-i="support"></b><a href="details.html" class="block mt-3" data-i="contact"></a></div><div><b data-i="newsletter"></b><input class="border p-2 mt-3 w-full" placeholder="Email"><button class="btn mt-2" data-i="join"></button></div></footer>
<script>
const T={pt:{announce:'Frete grátis em pedidos selecionados',shop:'Loja',categories:'Categorias',story:'Nossa história',heroTag:'Nova coleção',hero:'Seu estilo. Seu momento.',shopNow:'Comprar agora →',categoryTitle:'Comprar por categoria',cat1:'Moda feminina',cat2:'Moda masculina',cat3:'Calçados',cat4:'Acessórios',best:'Mais vendidos',viewAll:'Ver todos →',campaign:'Descubra a nova coleção',storyTitle:'Feito para o seu dia a dia',storyText:'Design, conforto e qualidade em cada detalhe.',tagline:'Descubra seu próximo favorito.',support:'Atendimento',contact:'Fale conosco',allProducts:'Todos os produtos',newsletter:'Receba novidades',join:'Cadastrar',price:'A partir de',product:'Produto'},
en:{announce:'Free shipping on selected orders',shop:'Shop',categories:'Categories',story:'Our story',heroTag:'New collection',hero:'Your style. Your moment.',shopNow:'Shop now →',categoryTitle:'Shop by category',cat1:'Women',cat2:'Men',cat3:'Shoes',cat4:'Accessories',best:'Best sellers',viewAll:'View all →',campaign:'Discover the new collection',storyTitle:'Made for everyday living',storyText:'Design, comfort and quality in every detail.',tagline:'Discover your next favorite.',support:'Support',contact:'Contact us',allProducts:'All products',newsletter:'Get updates',join:'Subscribe',price:'From',product:'Product'}};
const P=[['Classic Tee',29.90,'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600&q=80'],['Everyday Sneakers',79.90,'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&q=80'],['Urban Jacket',119.90,'https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=600&q=80'],['Daily Bag',59.90,'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=600&q=80']];
function render(l){products.innerHTML=P.map((p,i)=>`<a href="details.html?id=${i}&lang=${l}"><img src="${p[2]}" class="w-full aspect-[3/4] object-cover"><p class="text-xs mt-3">${p[0]}</p><p class="text-xs mt-1">${p[1].toLocaleString(l==='pt'?'pt-BR':'en-US',{style:'currency',currency:l==='pt'?'BRL':'USD'})}</p></a>`).join('')}
function setLang(l){localStorage.setItem('store-lang',l);document.documentElement.lang=l==='pt'?'pt-BR':'en';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[l][e.dataset.i]||'');lang.value=l;render(l);document.querySelectorAll('a[href]').forEach(a=>{let u=new URL(a.href,location.href);if(['index.html','list.html','details.html'].includes(u.pathname.split('/').pop())){u.searchParams.set('lang',l);a.href=u.pathname+u.search+u.hash}})}
let l=new URLSearchParams(location.search).get('lang')||localStorage.getItem('store-lang')||(navigator.language.toLowerCase().startsWith('pt')?'pt':'en');setLang(l);lang.onchange=()=>setLang(lang.value);menu.onclick=()=>mobileMenu.classList.toggle('hidden');
</script></body></html>
