
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uthao — Services</title><script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;color:#171717}.btn{background:#171717;color:white;padding:12px 20px;font-size:12px;border-radius:4px}</style>
</head>
<body>
<header class="border-b"><div class="max-w-7xl mx-auto px-5 py-5 flex justify-between items-center"><a href="index.html" class="text-2xl font-extrabold">Uthao.</a><nav class="hidden md:flex gap-7 text-xs"><a href="index.html" data-i="home"></a><a href="list.html" data-i="services"></a><a href="details.html" data-i="contact"></a></nav><div class="flex gap-4 items-center"><select id="lang" class="text-xs bg-transparent"><option value="pt">PT</option><option value="en">EN</option></select><a href="details.html" class="btn" data-i="start"></a></div></div></header>
<section class="bg-[#eaf1ff] px-5 py-16 text-center"><p class="text-xs text-blue-700 font-semibold tracking-widest" data-i="eyebrow"></p><h1 class="text-4xl md:text-5xl font-bold mt-4" data-i="title"></h1><p class="text-sm text-gray-500 mt-4" data-i="intro"></p><p class="text-xs text-gray-400 mt-6"><a href="index.html" data-i="home"></a> / <span data-i="services"></span></p></section>
<main class="max-w-7xl mx-auto px-5 py-14"><div class="flex flex-wrap justify-between gap-4 items-center mb-8"><h2 class="text-2xl font-bold" data-i="explore"></h2><input id="search" oninput="render()" placeholder="Buscar..." class="border rounded px-4 py-3 text-xs"></div><div id="services" class="grid md:grid-cols-3 gap-5"></div></main>
<section class="bg-[#f7f8fa] py-14 px-5 text-center"><h2 class="text-3xl font-bold" data-i="cta"></h2><p class="text-sm text-gray-500 mt-3" data-i="ctaText"></p><a href="details.html" class="btn inline-block mt-6" data-i="contact"></a></section>
<footer class="max-w-7xl mx-auto px-5 py-10 text-xs flex justify-between"><a href="index.html" class="font-bold text-xl">Uthao.</a><a href="details.html" data-i="contact"></a><span class="text-gray-400" data-i="copyright"></span></footer>
<script>
const T={
pt:{home:'Início',services:'Serviços',contact:'Contato',start:'Começar →',eyebrow:'NOSSAS SOLUÇÕES',title:'Serviços de carga aérea',intro:'Logística confiável para cada negócio.',explore:'Explore nossos serviços',cta:'Precisa de uma solução personalizada?',ctaText:'Fale com nossos especialistas em logística.',copyright:'© 2026 Uthao Logistics.',items:[['Frete aéreo padrão','Transporte confiável e econômico para cargas e operações do dia a dia.'],['Frete aéreo expresso','Transporte prioritário para remessas urgentes em todo o mundo.'],['Frete aéreo premium','Logística personalizada para cargas especiais.'],['Logística global','Transporte integrado e coordenação da cadeia de suprimentos.'],['Rastreamento de cargas','Visibilidade da remessa e atualizações de entrega em tempo real.'],['Cargas especiais','Soluções dedicadas para mercadorias frágeis, valiosas ou sensíveis.']]},
en:{home:'Home',services:'Services',contact:'Contact',start:'Get Started →',eyebrow:'OUR SOLUTIONS',title:'Air Cargo Services',intro:'Reliable logistics solutions for every business.',explore:'Explore our services',cta:'Need a tailored solution?',ctaText:'Talk to our logistics specialists.',copyright:'© 2026 Uthao Logistics.',items:[['Standard Air Freight','Reliable, cost-effective shipping for everyday cargo and business operations.'],['Express Air Freight','Priority transportation for time-sensitive shipments worldwide.'],['Premium Air Freight','Customized handling and premium logistics for specialized cargo.'],['Global Logistics','Integrated transportation and supply chain coordination.'],['Cargo Tracking','Real-time shipment visibility and delivery updates.'],['Special Cargo','Dedicated solutions for fragile, valuable and sensitive goods.']]}};
function setLang(l){localStorage.setItem('uthao-lang',l);document.documentElement.lang=l==='pt'?'pt-BR':'en';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[l][e.dataset.i]||'');lang.value=l;search.placeholder=l==='pt'?'Buscar serviços...':'Search services...';document.querySelectorAll('a[href]').forEach(a=>{let u=new URL(a.href,location.href);if(['index.html','list.html','details.html'].includes(u.pathname.split('/').pop())){u.searchParams.set('lang',l);a.href=u.pathname+u.search+u.hash}});render()}
let l=new URLSearchParams(location.search).get('lang')||localStorage.getItem('uthao-lang')||(navigator.language.toLowerCase().startsWith('pt')?'pt':'en');
function render(){services.innerHTML=T[l].items.filter(x=>x[0].toLowerCase().includes(search.value.toLowerCase())||x[1].toLowerCase().includes(search.value.toLowerCase())).map((x,i)=>`<a href="details.html?service=${i}&lang=${l}" class="border rounded-xl p-7 hover:bg-gray-50"><span class="text-3xl">${['✈','⚡','◈','◎','⌖','◇'][i]}</span><h3 class="font-bold text-lg mt-5">${x[0]}</h3><p class="text-sm text-gray-500 leading-6 mt-3">${x[1]}</p><span class="block text-xs font-semibold mt-6">${l==='pt'?'Saiba mais →':'Explore service →'}</span></a>`).join('')}
setLang(l);lang.onchange=()=>{l=lang.value;setLang(l)};
</script>
</body></html>
